name: Terraform Plan

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "terraform/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write  # planをPRにコメント投稿するために必要

env:
  AWS_REGION: ap-northeast-1

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - env: stg
            role_secret: AWS_DEPLOY_ROLE_ARN_STG
            tf_dir: terraform/environments/stg
            oauth_client_id_secret: GOOGLE_OAUTH_CLIENT_ID_STG
            oauth_client_secret_secret: GOOGLE_OAUTH_CLIENT_SECRET_STG
          - env: prd
            role_secret: AWS_DEPLOY_ROLE_ARN_PRD
            tf_dir: terraform/environments/prd
            oauth_client_id_secret: GOOGLE_OAUTH_CLIENT_ID_PRD
            oauth_client_secret_secret: GOOGLE_OAUTH_CLIENT_SECRET_PRD
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[matrix.role_secret] }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        working-directory: ${{ matrix.tf_dir }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: ${{ matrix.tf_dir }}
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true
        env:
          TF_VAR_google_oauth_client_id: ${{ secrets[matrix.oauth_client_id_secret] }}
          TF_VAR_google_oauth_client_secret: ${{ secrets[matrix.oauth_client_secret_secret] }}

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ matrix.tf_dir }}/plan_output.txt', 'utf8');
            const maxLen = 65000;
            const truncated = plan.length > maxLen
              ? plan.slice(0, maxLen) + '\n\n...(省略)'
              : plan;
            const status = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌';
            const body = [
              `### Terraform Plan — \`${{ matrix.env }}\` ${status}`,
              '',
              '<details><summary>plan の詳細を表示</summary>',
              '',
              '```terraform',
              truncated,
              '```',
              '</details>',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
