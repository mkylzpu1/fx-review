name: Deploy PRD

# AWSへは反映しない運用のため、自動実行を止めている（手動実行のみ）。
# 自動に戻す場合は、下の workflow_dispatch を元の push / pull_request に書き換える。
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-prd
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  TF_WORKING_DIR: terraform/environments/prd

permissions:
  id-token: write
  contents: read

jobs:
  # ─── 1. Terraform apply ─────────────────────────────────────
  terraform:
    name: Terraform Apply (PRD)
    runs-on: ubuntu-latest
    outputs:
      api_endpoint: ${{ steps.outputs.outputs.api_endpoint }}
      frontend_bucket: ${{ steps.outputs.outputs.frontend_bucket }}
      cloudfront_distribution_id: ${{ steps.outputs.outputs.cloudfront_distribution_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PRD }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve
        env:
          TF_VAR_google_oauth_client_id: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID_PRD }}
          TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_PRD }}

      - name: Get Terraform Outputs
        id: outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT
          echo "frontend_bucket=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_distribution_id=$(terraform output -raw frontend_cloudfront_distribution_id)" >> $GITHUB_OUTPUT

  # ─── 2. Lambda ビルド & デプロイ ──────────────────────────
  deploy-backend:
    name: Deploy Backend (PRD)
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PRD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install & Build
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Deploy Lambda Functions
        working-directory: backend
        run: |
          APP_NAME=$(cat ../terraform/environments/prd/terraform.tfvars 2>/dev/null | grep '^app_name' | cut -d'"' -f2 || echo "app")
          FUNCTION_PREFIX="${APP_NAME}-prd"

          for handler_dir in dist/handlers/*/; do
            feature=$(basename "$handler_dir")
            for js_file in "$handler_dir"*.js; do
              [ -f "$js_file" ] || continue
              name=$(basename "$js_file" .js)
              function_name="${FUNCTION_PREFIX}-${feature//_/-}-${name//_/-}"
              zip_file="/tmp/${function_name}.zip"
              zip -j "$zip_file" "$js_file"
              aws lambda update-function-code \
                --function-name "$function_name" \
                --zip-file "fileb://${zip_file}" \
                --region ${{ env.AWS_REGION }} || echo "skip: $function_name not found"
            done
          done

  # ─── 3. Frontend ビルド & S3 デプロイ ──────────────────────
  deploy-frontend:
    name: Deploy Frontend (PRD)
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PRD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ needs.terraform.outputs.api_endpoint }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID_PRD }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID_PRD }}
          VITE_COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN_PRD }}
          VITE_COGNITO_REDIRECT_URI: ${{ secrets.FRONTEND_URL_PRD }}/callback
          VITE_COGNITO_REDIRECT_SIGN_OUT_URI: ${{ secrets.FRONTEND_URL_PRD }}/login
        run: |
          npm ci
          npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ needs.terraform.outputs.frontend_bucket }}/ \
            --delete \
            --cache-control "public, max-age=60" \
            --exclude "assets/*"
          aws s3 sync frontend/dist/assets/ s3://${{ needs.terraform.outputs.frontend_bucket }}/assets/ \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.terraform.outputs.cloudfront_distribution_id }} \
            --paths "/*"
